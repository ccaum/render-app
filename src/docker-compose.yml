version: '3.8'

services:
  db:
    image: postgres:14-alpine
    container_name: christmas-countdown-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: christmas2024
      POSTGRES_DB: christmas_countdown
    volumes:
      - christmas_postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: christmas-countdown-app
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://postgres:christmas2024@db:5432/christmas_countdown
      PORT: 3000
      NODE_ENV: development
    volumes:
      - ../uploads:/app/uploads
      - ./public:/app/public
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  christmas_postgres_data:
    external: false
    name: christmas_postgres_data
